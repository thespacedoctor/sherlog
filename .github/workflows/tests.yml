name: Tests
# A CHANGE THAT TOUCHES ONLY CHANGES.md, OR A PUSH TO A PULL REQUEST THAT ONLY MOVED ITS BASE
# (A MERGE FROM, OR REBASE ONTO, THE BASE BRANCH THAT LEFT THE PULL REQUEST'S OWN CODE UNCHANGED,
# AFTER A PASSING RUN), SKIPS THE TEST JOB. THE DECISION IS THE SHARED change-scope WORKFLOW IN
# thespacedoctor/reusable-workflows. A JOB SKIPPED BY `if` PASSES A REQUIRED CHECK, UNLIKE A
# WORKFLOW SKIPPED BY `paths-ignore`, WHICH LEAVES IT PENDING
on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      actions: read
    uses: thespacedoctor/reusable-workflows/.github/workflows/change-scope.yml@main

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mysqlclient IS A C EXTENSION: IT NEEDS THE CLIENT HEADERS AND pkg-config TO BUILD
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Django system checks
        run: python manage.py check
      - name: Run tests
        run: pytest -q

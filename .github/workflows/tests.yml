name: Tests
# A CHANGE THAT TOUCHES ONLY CHANGES.md SKIPS THIS WORKFLOW
on:
  push:
    paths-ignore:
      - "CHANGES.md"
  pull_request:
    paths-ignore:
      - "CHANGES.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Django system checks
        run: python manage.py check
      - name: Run tests
        run: pytest -q

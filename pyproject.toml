[project]
name = "sherlog"
version = "0.1.0"
description = "Tools to test and debug the Sherlock contextual classifier for astronomical transients."
authors = [
    {name = "thespacedoctor", email = "david.young.rse@gmail.com"},
]
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-or-later"
dependencies = [
    "django-fundamentals>=0.2.0",
    "django>=5,<6",
    "mysqlclient>=2.2",
    "gunicorn>=23",
    "mod-wsgi>=5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-django"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

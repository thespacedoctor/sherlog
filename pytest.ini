[pytest]
DJANGO_SETTINGS_MODULE = sherlog.settings
python_files = test_*.py

# THE TEST SUITE ALWAYS RUNS ON SQLite, WHATEVER .env SAYS, SO IT NEEDS NO
# DATABASE SERVER — IN CI OR ON A MACHINE SET UP FOR MariaDB DEVELOPMENT.
# pytest-env SETS THIS BEFORE pytest-django CONFIGURES DJANGO, AND settings.py's
# load_dotenv WILL NOT OVERRIDE A VARIABLE THAT IS ALREADY SET.
env =
    DJANGO_DB=sqlite
